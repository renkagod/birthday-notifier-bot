services:
  bot:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('data/birthdays.db')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
